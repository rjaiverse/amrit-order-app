<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#1B3F8B" />
  <title>Amrit Foods — Sign In</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="gate-page">
  <main class="gate">
    <div class="gate-card">
      <img
        src="amrit_logo_header.png"
        alt="Amrit Foods Enterprises Inc."
        class="gate-logo"
        style="max-width: 220px; width: 100%; height: auto; margin: 0 auto 4px; display: block;"
        onerror="this.style.display='none'; document.getElementById('brandFallback').style.display='block';"
      />
      <div id="brandFallback" class="brand-mark" style="display:none">AMRIT FOODS</div>
      <p class="brand-sub">Sales Order App</p>
      <form id="gateForm" autocomplete="off">
        <label for="password" class="field-label">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          inputmode="text"
          autocapitalize="off"
          autocorrect="off"
          autocomplete="off"
          placeholder="Enter password"
          required
        />
        <p id="gateError" class="gate-error" role="alert" hidden>Incorrect password. Try again.</p>
        <button type="submit" class="btn btn-primary btn-block">Sign In</button>
      </form>
      <p class="gate-foot">Internal use only · Amrit Foods Enterprises Inc.</p>
    </div>
  </main>
  <script>
    // --- Shared password gate (soft, client-side only — NOT real security) ---
    // To change the password, update SHARED_PASSWORD below.
    var SHARED_PASSWORD = 'Amrit@order';
    var AUTH_KEY = 'amrit_auth';

    // Already signed in this session? Skip the gate.
    if (sessionStorage.getItem(AUTH_KEY) === 'ok') {
      window.location.replace('app.html');
    }

    document.getElementById('gateForm').addEventListener('submit', function (e) {
      e.preventDefault();
      var input = document.getElementById('password');
      var error = document.getElementById('gateError');
      if (input.value === SHARED_PASSWORD) {
        sessionStorage.setItem(AUTH_KEY, 'ok');
        window.location.replace('app.html');
      } else {
        error.hidden = false;
        input.value = '';
        input.focus();
      }
    });
  </script>
</body>
</html>
